name: Deploy Inventory Frontend to Production

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: Neonbee-ai/neonbee-devops/.github/workflows/neonbee-deploy-prod.yml@main
    with:
      service_name: inventory-fe
      deploy_type: vite-mfe
      nginx_root: /var/www/cdn.neonbee.app/html/inventory
      needs_shell_packages: true
      is_shell: false
      cf_purge_urls: 'https://cdn.neonbee.app/inventory/assets/remoteEntry.js,https://cdn.neonbee.app/inventory/index.html'
      vite_env: |
        VITE_BASE_URL=https://cdn.neonbee.app/inventory/
        VITE_SO360_CORE_API=https://api.neonbee.app/core
        VITE_SO360_INVENTORY_API=https://api.neonbee.app/inventory
        VITE_ENVIRONMENT=cloud
    secrets: inherit
